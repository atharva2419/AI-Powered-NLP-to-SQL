[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced here
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals on purpose, and conftest must set
# environment variables before the modules under test are imported.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
