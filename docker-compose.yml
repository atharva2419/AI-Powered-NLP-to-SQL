services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Local development: no throttling, verbose logs.
      RATE_LIMIT_ENABLED: "false"
      LOG_LEVEL: INFO
    volumes:
      # Parquet files stay on the host rather than in the image (~700 MB).
      # Run `python backend/data/download_data.py` first; if the directory is
      # empty the container bootstraps a sample on its own instead.
      - ./backend/data:/app/data
    healthcheck:
      # /health checks that the taxi view is actually queryable, not just that
      # the process is listening.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy   # wait until the data is loaded and queryable
