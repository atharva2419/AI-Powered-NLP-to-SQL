services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount local parquet file into the container — not baked into the image
      # Run `python backend/data/download_data.py` first if you don't have it yet
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/examples')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s   # parquet loading takes a few seconds on first start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy   # wait until backend passes its healthcheck
