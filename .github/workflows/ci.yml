name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint
        run: ruff check backend/

      - name: Run pytest
        run: pytest backend/tests/ -v --tb=short

      - name: Validate the evaluation set
        # No API key and no spend: this only proves every reference query in
        # the golden set still parses, passes the SQL guard and executes.
        # The real Parquet files are 700 MB and gitignored, so this runs
        # against the same generated fixture the test suite uses.
        working-directory: backend
        run: |
          python -m data.fixture --out /tmp/taxi_fixture.parquet
          TAXI_DATA_PATH=/tmp/taxi_fixture.parquet python -m eval.run --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Jest
        working-directory: frontend
        run: npm run test:ci

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Catches Dockerfile breakage without needing the 700 MB dataset or a
      # registry — images are built and thrown away.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
